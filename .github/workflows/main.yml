name: Static Analysis

# Apex code review is handled natively by GitHub Copilot.
# Copilot reads .github/copilot-instructions.md and
# .github/instructions/*.instructions.md automatically on every PR.
# This workflow only runs static analysis tools.

on:
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  eslint:
    continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get changed JS files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: '**/*.js'
      - name: Run ESLint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          npm ci --ignore-scripts
          npx eslint ${{ steps.changed-files.outputs.all_changed_files }}
 
  salesforce-code-analyzer-workflow:
    continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '>=20.9.0'
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
      - uses: actions/setup-python@v5
        with:
          python-version: '>=3.10'
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest
      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer@latest
      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --rule-selector AppExchange --workspace . --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: salesforce-code-analyzer-results
      - name: Fail on violations
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-sev2-violations > 0
        run: exit 1
