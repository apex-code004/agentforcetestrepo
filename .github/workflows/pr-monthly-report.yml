name: Monthly PR Report (CSV)

on:
  workflow_dispatch:
    inputs:
      username:
        description: "PR author username"
        required: true
      month:
        description: "Month (YYYY-MM)"
        required: true
      org:
        description: "Org or owner"
        required: true
      repo:
        description: "Repository name"
        required: true

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install axios csv-stringify

      - name: Generate CSV Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const axios = require("axios");
          const stringify = require("csv-stringify/sync").stringify;
          const fs = require("fs");

          const username = process.env.INPUT_USERNAME;
          const month = process.env.INPUT_MONTH;
          const org = process.env.INPUT_ORG;
          const repo = process.env.INPUT_REPO;
          const token = process.env.GH_TOKEN;

          const start = `${month}-01T00:00:00Z`;
          const end = new Date(new Date(start).getFullYear(), new Date(start).getMonth() + 1, 1).toISOString();

          async function get(url) {
            return axios.get(url, {
              headers: { Authorization: `Bearer ${token}` }
            }).then(res => res.data);
          }

          async function getPRs() {
            const url = `https://api.github.com/repos/${org}/${repo}/pulls?state=all&per_page=100`;
            return get(url);
          }

          async function getFiles(prNumber) {
            return get(`https://api.github.com/repos/${org}/${repo}/pulls/${prNumber}/files`);
          }

          async function getReviews(prNumber) {
            return get(`https://api.github.com/repos/${org}/${repo}/pulls/${prNumber}/reviews`);
          }

          (async () => {
            const prs = await getPRs();

            const filteredPRs = prs.filter(pr =>
              pr.user.login === username &&
              pr.created_at >= start &&
              pr.created_at < end
            );

            const rows = [
              [
                "PR Number",
                "Title",
                "Created By",
                "Source Branch",
                "Target Branch",
                "Description",
                "Files Modified",
                "Files Added",
                "Reviewers"
              ]
            ];

            for (const pr of filteredPRs) {
              const files = await getFiles(pr.number);
              const reviews = await getReviews(pr.number);

              const fileModifiedCount = files.length;
              const fileAddedCount = files.filter(f => f.status === "added").length;

              const reviewers = [...new Set(reviews.map(r => r.user.login))].join(",");

              rows.push([
                pr.number,
                pr.title,
                pr.user.login,
                pr.head.ref,
                pr.base.ref,
                pr.body ? pr.body.replace(/\n/g, " ") : "",
                fileModifiedCount,
                fileAddedCount,
                reviewers
              ]);
            }

            const csv = stringify(rows);
            fs.writeFileSync("monthly_pr_report.csv", csv);
            console.log("CSV report generated: monthly_pr_report.csv");
          })();
          EOF

      - name: Upload CSV Report
        uses: actions/upload-artifact@v4
        with:
          name: monthly_pr_report
          path: monthly_pr_report.csv
